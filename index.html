<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인 프로필 카드</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <div class="card">
      <div class="card-header">
        <div class="avatar-wrapper">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="프로필 사진" class="avatar">
        </div>
      </div>
      
      <div class="card-body">
        <h2 class="name">김하늘</h2>
        <span class="role">Frontend Developer</span>
        <p class="bio">더 나은 사용자 경험을 디자인하고 구현하는 개발자입니다.</p>
        
        <div class="social-links">
          <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-btn github" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-btn linkedin" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn instagram" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>
        </div>

        <button class="contact-btn" id="contactBtn">연락하기</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
